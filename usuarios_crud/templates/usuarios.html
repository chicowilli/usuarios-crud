<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <main class="page-shell">
        <div class="header-container">
            <h1>Usuarios</h1>
            <a href="{{ url_for('nuevo_usuario') }}" class="nuevo-link">Nuevo usuario</a>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nombre completo</th>
                        <th>E-mail</th>
                        <th>Fecha de creación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for usuario in usuarios %}
                    <tr>
                        <td>{{ usuario.id }}</td>
                        <td>{{ usuario.nombre }} {{ usuario.apellido }}</td>
                        <td>{{ usuario.email }}</td>
                        <td>{{ usuario.created_at.strftime('%Y-%m-%d') if usuario.created_at else '' }}</td>
                        <td class="acciones">
                            <a href="{{ url_for('ver_usuario', usuario_id=usuario.id) }}">Ver</a>
                            <a href="{{ url_for('editar_usuario', usuario_id=usuario.id) }}">Editar</a>
                            <a href="{{ url_for('borrar_usuario', usuario_id=usuario.id) }}">Borrar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
