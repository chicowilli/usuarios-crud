<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear nuevo usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="form-page">
        <a href="{{ url_for('listar_usuarios') }}" class="back-link">Volver a usuarios</a>
        <h1>Crear nuevo usuario</h1>

        <form action="{{ url_for('crear_usuario') }}" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" maxlength="45" value="{{ datos.nombre if datos else '' }}" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" maxlength="45" value="{{ datos.apellido if datos else '' }}" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" maxlength="45" value="{{ datos.email if datos else '' }}" required>
            </div>

            <button type="submit">Crear usuario</button>
        </form>
    </main>
</body>
</html>
